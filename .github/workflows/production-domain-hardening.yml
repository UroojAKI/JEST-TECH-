name: Production domain hardening

on:
  push:
    branches: [production-rebuild-2026]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, 'domain-hardening: claims leads') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply domain fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'Anchor not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old, new, 1))

          # Leads: never manufacture customer identity data.
          leads = Path('apps/api/src/modules/leads/services/leads.service.ts')
          s = leads.read_text()
          old = '''    if (!targetContactId) {
      let existingContact: any = null;
      if (dto.phone) {
        existingContact = await this.prisma.contact.findFirst({
          where: { phone: dto.phone, deletedAt: null },
        });
      }
      if (!existingContact && dto.email) {
        existingContact = await this.prisma.contact.findFirst({
          where: { email: dto.email, deletedAt: null },
        });
      }

      if (existingContact) {
        targetContactId = existingContact.id;
      } else {
        const createdContact = await this.contactsService.create(
          {
            firstName:
              dto.firstName ||
              (dto.title ? dto.title.split(' ')[0] : 'Prospect'),
            lastName: dto.lastName || '',
            email: dto.email || `prospect_${Date.now()}@jestpolicy.com`,
            phone:
              dto.phone ||
              `${Math.floor(1000000000 + Math.random() * 9000000000)}`,
            type: 'INDIVIDUAL',
          },
          createdById,
        );
        targetContactId = createdContact.id;
      }
    }'''
          new = '''    if (!targetContactId) {
      if (!dto.phone) {
        throw new BadRequestException(
          'Lead creation requires a real customer phone number or an existing contactId. Synthetic phone numbers are prohibited.',
        );
      }

      let existingContact: any = null;
      existingContact = await this.prisma.contact.findFirst({
        where: { phone: dto.phone, deletedAt: null },
      });
      if (!existingContact && dto.email) {
        existingContact = await this.prisma.contact.findFirst({
          where: { email: dto.email, deletedAt: null },
        });
      }

      if (existingContact) {
        targetContactId = existingContact.id;
      } else {
        const createdContact = await this.contactsService.create(
          {
            firstName: dto.firstName || (dto.title ? dto.title.split(' ')[0] : undefined),
            lastName: dto.lastName || undefined,
            email: dto.email,
            phone: dto.phone,
            type: 'INDIVIDUAL',
          },
          createdById,
        );
        targetContactId = createdContact.id;
      }
    }'''
          if old not in s: raise SystemExit('Lead synthetic-contact block not found')
          leads.write_text(s.replace(old, new, 1))

          # Leads: quotation conversion must pass the authoritative completion gate.
          replace('apps/api/src/modules/leads/services/leads.service.ts',
              '''    private readonly scopeResolver: ScopeResolver,
  ) {}''',
              '''    private readonly scopeResolver: ScopeResolver,
    private readonly leadCompletionService: LeadCompletionService,
  ) {}''')
          replace('apps/api/src/modules/leads/services/leads.service.ts',
              '''import { PaginatedResponseDto } from '../../../common/pagination/paginated-response.dto';''',
              '''import { PaginatedResponseDto } from '../../../common/pagination/paginated-response.dto';
import { LeadCompletionService } from './lead-completion.service';''')
          replace('apps/api/src/modules/leads/services/leads.service.ts',
              '''    if (existing.status === LeadStatus.CONVERTED) {
      throw new BadRequestException('Lead is already converted');
    }''',
              '''    if (existing.status === LeadStatus.CONVERTED) {
      throw new BadRequestException('Lead is already converted');
    }

    const completion = await this.leadCompletionService.computeCompletionStatus(id);
    if (!completion.isQualifiedForQuotation) {
      throw new BadRequestException({
        code: 'LEAD_NOT_READY',
        message: 'Lead cannot be converted until required completion gates are satisfied.',
        blockingReasons: completion.blockingReasons,
        missingFields: completion.stages.filter((stage) => !stage.isComplete).flatMap((stage) => stage.missingFields),
      });
    }''')

          # Leads: KPI endpoint must never manufacture telemetry.
          controller = Path('apps/api/src/modules/leads/controllers/leads.controller.ts')
          s = controller.read_text()
          start = s.index("  async getLeadKpis(@CurrentUser() user: RequestUser) {")
          end = s.index("\n  @Get('check-duplicate')", start)
          new_kpi = '''  async getLeadKpis(@CurrentUser() user: RequestUser) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const tomorrow = new Date(today);
    tomorrow.setDate(tomorrow.getDate() + 1);

    const role = String(user.role || '').toUpperCase();
    const where: any = {};
    if (role === 'BRANCH_MANAGER' && user.branchId) {
      where.assignedTo = { branchId: user.branchId };
    } else if (role === 'TEAM_LEADER' && user.teamId) {
      where.assignedTo = { teamId: user.teamId };
    } else if (!['SUPER_ADMIN', 'ADMIN', 'SYSTEM_ADMINISTRATOR', 'MD_CEO'].includes(role)) {
      where.assignedToId = user.id;
    }

    const [totalLeads, todaysLeads, hotLeads, wonLeads, lostLeads, pendingLeads, todaysFollowups] = await Promise.all([
      this.prisma.lead.count({ where }),
      this.prisma.lead.count({ where: { ...where, createdAt: { gte: today, lt: tomorrow } } }),
      this.prisma.lead.count({ where: { ...where, priority: 'HIGH', status: { notIn: ['CONVERTED', 'LOST', 'UNQUALIFIED'] } } }),
      this.prisma.lead.count({ where: { ...where, status: 'CONVERTED' } }),
      this.prisma.lead.count({ where: { ...where, status: { in: ['LOST', 'UNQUALIFIED'] } } }),
      this.prisma.lead.count({ where: { ...where, status: { in: ['NEW', 'CONTACTED', 'QUALIFIED', 'DOCS_RECEIVED', 'QUOTE_PREPARED', 'NEGOTIATION'] } } }),
      this.prisma.lead.count({ where: { ...where, nextFollowup: { gte: today, lt: tomorrow } } }),
    ]);

    const conversionRate = totalLeads > 0 ? ((wonLeads / totalLeads) * 100).toFixed(1) : '0.0';
    return {
      totalLeads,
      todaysLeads,
      hotLeads,
      won: wonLeads,
      lost: lostLeads,
      pending: pendingLeads,
      todaysFollowups,
      conversionRatePercentage: `${conversionRate}%`,
    };
  }
'''
          controller.write_text(s[:start] + new_kpi + s[end:])

          # Lead completion: description text is not proof of previous-policy data;
          # only an explicitly new vehicle can satisfy this stage without prior-policy data.
          completion = Path('apps/api/src/modules/leads/services/lead-completion.service.ts')
          s = completion.read_text()
          old = '''    // Check if description or lead metadata notes contain previous policy info
    const desc = (lead.description || '').toLowerCase();
    const hasPreviousPolicy =
      desc.includes('policy') ||
      desc.includes('expiry') ||
      desc.includes('ncb') ||
      desc.includes('previous');

    if (hasPreviousPolicy || vehicle?.status === 'NEW') {
      stage4Score = 20;
    } else {
      stage4Missing.push(
        'Previous policy status, expiry date, or NCB declaration',
      );
      stage4Score = 10; // Partial
    }'''
          new = '''    // Free-text description is not authoritative proof of prior-policy/NCB data.
    // A brand-new vehicle is the only case that can legitimately skip prior-policy evidence.
    if (vehicle?.status === 'NEW') {
      stage4Score = 20;
    } else {
      stage4Missing.push(
        'Previous policy status, expiry date, or NCB declaration',
      );
      stage4Score = 0;
    }'''
          if old not in s: raise SystemExit('Lead completion previous-policy block not found')
          completion.write_text(s.replace(old, new, 1))

          # Claims: settlement must not overwrite approvedAmount or equate a UTR with verified payment.
          schema = Path('apps/api/prisma/schema.prisma')
          s = schema.read_text()
          if 'enum ClaimSettlementStatus' not in s:
              s = s.replace('enum ClaimStatus {', '''enum ClaimSettlementStatus {
  REQUESTED
  PAYMENT_PENDING
  VERIFIED
  REJECTED
}

enum ClaimStatus {''', 1)
          old_claim = '''  claimAmount    Decimal
  approvedAmount Decimal?

  surveyorName'''
          new_claim = '''  claimAmount    Decimal
  approvedAmount Decimal?
  settlementAmount Decimal?
  settlementPaymentReference String?
  settlementPaymentMethod String?
  settlementStatus ClaimSettlementStatus?
  settlementRequestedAt DateTime?
  settlementVerifiedAt DateTime?
  settlementVerifiedById String?

  surveyorName'''
          if old_claim not in s: raise SystemExit('Claim financial anchor not found')
          s = s.replace(old_claim, new_claim, 1)
          schema.write_text(s)

          migration = Path('apps/api/prisma/migrations/20260901193000_claim_settlement_verification')
          migration.mkdir(parents=True, exist_ok=True)
          (migration / 'migration.sql').write_text('''CREATE TYPE "ClaimSettlementStatus" AS ENUM ('REQUESTED', 'PAYMENT_PENDING', 'VERIFIED', 'REJECTED');
ALTER TABLE "claims"
  ADD COLUMN "settlementAmount" DECIMAL(19,4),
  ADD COLUMN "settlementPaymentReference" TEXT,
  ADD COLUMN "settlementPaymentMethod" TEXT,
  ADD COLUMN "settlementStatus" "ClaimSettlementStatus",
  ADD COLUMN "settlementRequestedAt" TIMESTAMP(3),
  ADD COLUMN "settlementVerifiedAt" TIMESTAMP(3),
  ADD COLUMN "settlementVerifiedById" TEXT;
CREATE INDEX "claims_settlementStatus_idx" ON "claims"("settlementStatus");
CREATE INDEX "claims_settlementPaymentReference_idx" ON "claims"("settlementPaymentReference");
''')

          # Claims: settle becomes a settlement request. Final SETTLED requires an explicit
          # finance verification action, so a client-provided UTR cannot create a settled claim.
          settle = Path('apps/api/src/modules/claims/services/commands/settle-claim.service.ts')
          s = settle.read_text()
          s = s.replace("ClaimStateMachine.validateTransition(claim.status, ClaimStatus.SETTLED);", "ClaimStateMachine.validateTransition(claim.status, ClaimStatus.PAYMENT_PENDING);", 1)
          old_update = '''          status: ClaimStatus.SETTLED,
          approvedAmount: new Prisma.Decimal(dto.settlementAmount),
          updatedById: actorId,'''
          new_update = '''          status: ClaimStatus.PAYMENT_PENDING,
          settlementAmount: new Prisma.Decimal(dto.settlementAmount),
          settlementPaymentReference: dto.paymentReference.trim(),
          settlementPaymentMethod: dto.paymentMethod,
          settlementStatus: 'PAYMENT_PENDING',
          settlementRequestedAt: new Date(),
          updatedById: actorId,'''
          if old_update not in s: raise SystemExit('Claim settlement update anchor not found')
          s = s.replace(old_update, new_update, 1)
          s = s.replace('Claim settled for ₹${dto.settlementAmount.toLocaleString(\'en-IN\')} via ${dto.paymentMethod} (Ref: ${dto.paymentReference})', 'Claim settlement requested for ₹${dto.settlementAmount.toLocaleString(\'en-IN\')} via ${dto.paymentMethod} (Ref: ${dto.paymentReference}); finance verification is required before settlement.', 1)
          settle.write_text(s)

          # State machine: approved -> payment pending; payment pending -> settled after verification.
          sm = Path('apps/api/src/modules/claims/domain/claim-state-machine.ts')
          s = sm.read_text()
          s = s.replace('''    [ClaimStatus.APPROVED]: [
      ClaimStatus.PAYMENT_PENDING,
      ClaimStatus.SETTLED,
      ClaimStatus.CLOSED,
    ],''', '''    [ClaimStatus.APPROVED]: [
      ClaimStatus.PAYMENT_PENDING,
      ClaimStatus.CLOSED,
    ],''', 1)
          sm.write_text(s)

          # Add explicit finance verification endpoint.
          controller = Path('apps/api/src/modules/claims/controllers/claims.controller.ts')
          s = controller.read_text()
          anchor = '''  @Post(':id/reject')'''
          method = '''  @Post(':id/settlement/verify')
  @HttpCode(HttpStatus.OK)
  @Roles(RoleType.SUPER_ADMIN, RoleType.ADMIN, RoleType.FINANCE)
  async verifySettlement(
    @Param('id', ParseUUIDPipe) id: string,
    @Body('verificationReference') verificationReference: string,
    @CurrentUser() user: RequestUser,
  ) {
    if (!verificationReference?.trim()) {
      throw new BadRequestException('Finance verification reference is mandatory');
    }
    return this.settleClaimService.verifySettlement(id, verificationReference.trim(), user.id);
  }

'''
          if anchor not in s: raise SystemExit('Claims controller insertion anchor not found')
          s = s.replace("import {\n  Body,", "import {\n  Body,", 1)
          s = s.replace("  Query,\n  ParseUUIDPipe,", "  Query,\n  ParseUUIDPipe,\n  BadRequestException,", 1)
          s = s.replace(anchor, method + anchor, 1)
          controller.write_text(s)

          # Implement the explicit verification command using the persisted settlement request.
          settle = Path('apps/api/src/modules/claims/services/commands/settle-claim.service.ts')
          s = settle.read_text()
          marker = '''  async execute(claimId: string, dto: SettleClaimDto, actorId: string) {'''
          verify_method = '''  async verifySettlement(claimId: string, verificationReference: string, actorId: string) {
    const claim = await this.prisma.claim.findUnique({ where: { id: claimId } });
    if (!claim) throw new NotFoundException(`Claim with ID ${claimId} not found`);
    if (claim.status !== ClaimStatus.PAYMENT_PENDING || claim.settlementStatus !== 'PAYMENT_PENDING') {
      throw new BadRequestException('Claim does not have a pending settlement requiring finance verification');
    }
    if (claim.createdById === actorId) {
      throw new ForbiddenException('Segregation of duties violation: the claim reporter cannot verify settlement');
    }

    return this.prisma.$transaction(async (tx) => {
      const updated = await tx.claim.update({
        where: { id: claimId },
        data: {
          status: ClaimStatus.SETTLED,
          settlementStatus: 'VERIFIED',
          settlementVerifiedAt: new Date(),
          settlementVerifiedById: actorId,
          updatedById: actorId,
        },
      });
      await tx.claimHistory.create({
        data: {
          claimId,
          status: ClaimStatus.SETTLED,
          action: 'SETTLEMENT_VERIFIED',
          comments: `Finance settlement verification reference: ${verificationReference}`,
          createdById: actorId,
        },
      });
      return updated;
    });
  }

'''
          if marker not in s: raise SystemExit('Settlement execute marker not found')
          settle.write_text(s.replace(marker, verify_method + marker, 1))

      - name: Validate schema and build API
        working-directory: apps/api
        run: |
          npx prisma validate
          npx prisma generate
          npm run build

      - name: Commit hardening changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/production-domain-hardening.yml
          git add apps/api/prisma/schema.prisma apps/api/prisma/migrations/20260901193000_claim_settlement_verification/migration.sql apps/api/src/modules/leads apps/api/src/modules/claims
          git commit -m "domain-hardening: claims leads"
          git push
