name: CI Quality Gates

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  api-quality-gates:
    name: API Quality Gates, Security & E2E (F-030)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan source for leaked secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git --redact --no-banner /repo

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Frozen lockfile install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api run prisma:generate

      - name: Apply database migrations to test container
        run: pnpm --filter api exec prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jest_test

      - name: TypeScript typecheck — API
        run: pnpm exec tsc --noEmit --project apps/api/tsconfig.json

      - name: Dependency Security Audit
        run: pnpm audit --audit-level=high

      - name: Heuristic controller tenant-scope scan (not a complete isolation proof)
        run: pnpm run check:tenancy

      - name: Quality Gate — Production Mock Data & AST Scanner (F-036)
        run: pnpm run check:mock-data

      - name: Unit tests — API
        run: pnpm --filter api test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jest_test
          JWT_SECRET: "ci_test_jwt_secret_min_32_characters_for_testing_purposes"
          JWT_REFRESH_SECRET: "ci_test_jwt_refresh_secret_min_32_characters_for_testing"
          PII_ENCRYPTION_KEY: "ci_test_pii_encryption_key_32_chars_testing!!"
          COOKIE_SECRET: "ci_test_cookie_secret_min_32_characters_testing"
          CSRF_SECRET: "ci_test_csrf_secret_min_32_characters_testing"
          REDIS_ENABLED: "false"

      - name: Certification & Security tests — API
        run: pnpm --filter api test:cert
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jest_test
          JWT_SECRET: "ci_test_jwt_secret_min_32_characters_for_testing_purposes"
          JWT_REFRESH_SECRET: "ci_test_jwt_refresh_secret_min_32_characters_for_testing"
          PII_ENCRYPTION_KEY: "ci_test_pii_encryption_key_32_chars_testing!!"
          COOKIE_SECRET: "ci_test_cookie_secret_min_32_characters_testing"
          CSRF_SECRET: "ci_test_csrf_secret_min_32_characters_testing"
          REDIS_ENABLED: "false"

      - name: End-to-End tests — API
        run: pnpm --filter api test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jest_test
          JWT_SECRET: "ci_test_jwt_secret_min_32_characters_for_testing_purposes"
          JWT_REFRESH_SECRET: "ci_test_jwt_refresh_secret_min_32_characters_for_testing"
          PII_ENCRYPTION_KEY: "ci_test_pii_encryption_key_32_chars_testing!!"
          COOKIE_SECRET: "ci_test_cookie_secret_min_32_characters_testing"
          CSRF_SECRET: "ci_test_csrf_secret_min_32_characters_testing"
          REDIS_ENABLED: "false"

      - name: Live Health Readiness Probe (HTTP smoke test)
        run: |
          echo "Building API artifact..."
          pnpm --filter api run build
          API_ENTRY="apps/api/dist/main.js"
          if [ ! -f "$API_ENTRY" ]; then
            echo "ERROR: Expected Nest build artifact not found: $API_ENTRY"
            echo "Available main.js artifacts:"
            find apps/api/dist -maxdepth 3 -type f -name 'main.js' -print || true
            exit 1
          fi
          echo "Launching API daemon from $API_ENTRY..."
          node "$API_ENTRY" &
          API_PID=$!
          cleanup() { kill "$API_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          echo "Polling HTTP readiness probe on http://127.0.0.1:4000/api/v1/health/ready..."
          for i in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:4000/api/v1/health/ready; then
              echo "API is live and ready!"
              exit 0
            fi
            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "ERROR: API process exited before readiness succeeded."
              exit 1
            fi
            sleep 1
          done
          echo "ERROR: Health probe timed out."
          exit 1
        env:
          PORT: "4000"
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jest_test
          JWT_SECRET: "ci_test_jwt_secret_min_32_characters_for_testing_purposes"
          JWT_REFRESH_SECRET: "ci_test_jwt_refresh_secret_min_32_characters_for_testing"
          PII_ENCRYPTION_KEY: "ci_test_pii_encryption_key_32_chars_testing!!"
          REDIS_ENABLED: "false"

  web-quality-gates:
    name: Web Quality Gates & Independent Reporting (F-032)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Frozen lockfile install
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck — Web
        run: pnpm exec tsc --noEmit --project apps/web/tsconfig.json

      - name: Unit & Integration tests — Web (Vitest)
        run: pnpm --filter web test
        env:
          NODE_ENV: test

      - name: Build Web Application
        run: pnpm --filter web build
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: "1"
