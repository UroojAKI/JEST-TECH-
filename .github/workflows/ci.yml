name: CI Quality Gates

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  api-quality-gates:
    name: API Quality Gates, Security & E2E (F-030)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Frozen lockfile install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api run prisma:generate

      - name: TypeScript typecheck — API
        run: pnpm exec tsc --noEmit --project apps/api/tsconfig.json

      - name: Architecture Guard — Fail-Closed Multi-Tenant Scoping (Section 15)
        run: pnpm run check:tenancy

      - name: Quality Gate — Production Mock Data & AST Scanner (F-036)
        run: pnpm run check:mock-data

      - name: Unit tests — API
        run: pnpm --filter api test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jest_test

      - name: Certification & Security tests — API
        run: pnpm --filter api test:cert
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jest_test

      - name: End-to-End tests — API
        run: pnpm --filter api test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jest_test

      - name: Live Health Readiness Probe (HTTP smoke test)
        run: |
          echo "Executing real HTTP readiness probe against /health/ready..."
          pnpm --filter api exec jest src/modules/health/health.controller.spec.ts --runInBand

  web-quality-gates:
    name: Web Quality Gates & Independent Reporting (F-032)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Frozen lockfile install
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck — Web
        run: pnpm exec tsc --noEmit --project apps/web/tsconfig.json

      - name: Unit & Integration tests — Web (Vitest)
        run: pnpm --filter web test
        env:
          NODE_ENV: test
