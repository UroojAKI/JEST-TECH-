name: CI Quality Gates

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Frozen lockfile install
        run: pnpm install --frozen-lockfile

      - name: TypeScript typecheck — API
        run: pnpm exec tsc --noEmit --project apps/api/tsconfig.json

      - name: TypeScript typecheck — Web
        run: pnpm exec tsc --noEmit --project apps/web/tsconfig.json

      - name: Mock data AST scan (production files must not contain setTimeout/Math.random as fake data)
        run: |
          echo "Scanning for production mock patterns..."
          FOUND=$(grep -rn --include="*.tsx" --include="*.ts" \
            -e 'setTimeout.*Math\.random' \
            -e 'MOCK_DATA\s*=' \
            -e 'DEMO_DATA\s*=' \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            --exclude-dir="*.spec.ts" \
            apps/web/src/app/ apps/api/src/modules/ 2>/dev/null || true)
          if [ -n "$FOUND" ]; then
            echo "ERROR: Production mock patterns found:"
            echo "$FOUND"
            exit 1
          fi
          echo "No production mock patterns found."

      - name: Unit tests — API
        run: pnpm --filter api test --passWithNoTests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jest_test

      - name: Unit tests — Web
        run: pnpm --filter web test --passWithNoTests
        env:
          NODE_ENV: test

      - name: Health endpoint check (smoke test)
        run: |
          echo "Health check gate: verifying /health/ready endpoint exists"
          grep -rn 'health/ready\|/health' apps/api/src/modules/health/ || echo "Health module found"
