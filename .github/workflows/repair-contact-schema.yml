name: One-time Contact Schema Repair

on:
  push:
    branches:
      - production-rebuild-2026

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, 'schema(contact): add authoritative ownership lifecycle') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Prisma schema and migration
        shell: python
        run: |
          from pathlib import Path
          import re

          schema_path = Path('apps/api/prisma/schema.prisma')
          schema = schema_path.read_text()
          marker = '// JEST CONTACT OWNERSHIP LIFECYCLE'
          if marker in schema:
              raise SystemExit('Schema already patched; nothing to do.')

          schema = schema.replace(
              'enum ContactType {',
              'enum ContactStatus {\n  NEW\n  ACTIVE\n  INACTIVE\n  ARCHIVED\n}\n\nenum ContactType {'
          )

          schema = schema.replace(
              '  contactsUpdated Contact[] @relation("ContactUpdatedBy")',
              '  contactsUpdated Contact[] @relation("ContactUpdatedBy")\n\n  contactsOwned Contact[] @relation("ContactOwner")'
          )

          schema = schema.replace(
              '  regions Region[]',
              '  regions Region[]\n  contacts Contact[]'
          )

          schema = schema.replace(
              '  users       User[]',
              '  users       User[]\n  contacts    Contact[]'
          )

          old = '''model Contact {\n  id String @id @default(uuid())'''
          new = '''model Contact {\n  // JEST CONTACT OWNERSHIP LIFECYCLE\n  id String @id @default(uuid())\n\n  companyId String?\n  branchId  String?\n  ownerId   String?\n\n  company Company? @relation(fields: [companyId], references: [id], onDelete: Restrict)\n  branch  Branch?  @relation(fields: [branchId], references: [id], onDelete: Restrict)\n  owner   User?    @relation("ContactOwner", fields: [ownerId], references: [id], onDelete: SetNull)\n\n  normalizedPhone String?\n  normalizedEmail String?\n  status ContactStatus @default(ACTIVE)\n  tags   String[] @default([])'''
          if old not in schema:
              raise SystemExit('Contact model anchor not found')
          schema = schema.replace(old, new, 1)

          schema = schema.replace(
              '  @@index([updatedById])\n  @@map("contacts")',
              '  @@index([updatedById])\n  @@index([companyId])\n  @@index([branchId])\n  @@index([ownerId])\n  @@index([status])\n  @@index([normalizedEmail])\n  @@unique([companyId, normalizedPhone])\n  @@unique([companyId, normalizedEmail])\n  @@map("contacts")'
          )
          schema_path.write_text(schema)

          migration = Path('apps/api/prisma/migrations/20260901190000_contact_ownership_lifecycle')
          migration.mkdir(parents=True, exist_ok=True)
          sql = '''CREATE TYPE "ContactStatus" AS ENUM ('NEW', 'ACTIVE', 'INACTIVE', 'ARCHIVED');

ALTER TABLE "contacts"
  ADD COLUMN "companyId" TEXT,
  ADD COLUMN "branchId" TEXT,
  ADD COLUMN "ownerId" TEXT,
  ADD COLUMN "normalizedPhone" TEXT,
  ADD COLUMN "normalizedEmail" TEXT,
  ADD COLUMN "status" "ContactStatus" NOT NULL DEFAULT 'ACTIVE',
  ADD COLUMN "tags" TEXT[] NOT NULL DEFAULT ARRAY[]::TEXT[];

UPDATE "contacts" c
SET
  "ownerId" = c."createdById",
  "branchId" = u."branchId",
  "companyId" = r."companyId"
FROM "users" u
LEFT JOIN "branches" b ON b."id" = u."branchId"
LEFT JOIN "zones" z ON z."id" = b."zoneId"
LEFT JOIN "regions" r ON r."id" = z."regionId"
WHERE c."createdById" = u."id";

UPDATE "contacts"
SET "normalizedPhone" = CASE
  WHEN "phone" ~ '^[6-9][0-9]{9}$' THEN '+91' || "phone"
  WHEN "phone" ~ '^\\+91[6-9][0-9]{9}$' THEN "phone"
  ELSE NULL
END,
"normalizedEmail" = CASE WHEN "email" IS NULL OR btrim("email") = '' THEN NULL ELSE lower(btrim("email")) END;

WITH phone_dupes AS (
  SELECT id, ROW_NUMBER() OVER (PARTITION BY "companyId", "normalizedPhone" ORDER BY "createdAt", id) rn
  FROM "contacts" WHERE "normalizedPhone" IS NOT NULL
)
UPDATE "contacts" c SET "normalizedPhone" = NULL FROM phone_dupes d WHERE c.id = d.id AND d.rn > 1;

WITH email_dupes AS (
  SELECT id, ROW_NUMBER() OVER (PARTITION BY "companyId", "normalizedEmail" ORDER BY "createdAt", id) rn
  FROM "contacts" WHERE "normalizedEmail" IS NOT NULL
)
UPDATE "contacts" c SET "normalizedEmail" = NULL FROM email_dupes d WHERE c.id = d.id AND d.rn > 1;

ALTER TABLE "contacts"
  ADD CONSTRAINT "contacts_companyId_fkey" FOREIGN KEY ("companyId") REFERENCES "companies"("id") ON DELETE RESTRICT ON UPDATE CASCADE,
  ADD CONSTRAINT "contacts_branchId_fkey" FOREIGN KEY ("branchId") REFERENCES "branches"("id") ON DELETE RESTRICT ON UPDATE CASCADE,
  ADD CONSTRAINT "contacts_ownerId_fkey" FOREIGN KEY ("ownerId") REFERENCES "users"("id") ON DELETE SET NULL ON UPDATE CASCADE;

CREATE INDEX "contacts_companyId_idx" ON "contacts"("companyId");
CREATE INDEX "contacts_branchId_idx" ON "contacts"("branchId");
CREATE INDEX "contacts_ownerId_idx" ON "contacts"("ownerId");
CREATE INDEX "contacts_status_idx" ON "contacts"("status");
CREATE INDEX "contacts_normalizedEmail_idx" ON "contacts"("normalizedEmail");
CREATE UNIQUE INDEX "contacts_companyId_normalizedPhone_key" ON "contacts"("companyId", "normalizedPhone");
CREATE UNIQUE INDEX "contacts_companyId_normalizedEmail_key" ON "contacts"("companyId", "normalizedEmail");
'''
          (migration / 'migration.sql').write_text(sql)

      - name: Validate Prisma schema
        working-directory: apps/api
        run: npx prisma validate

      - name: Commit schema repair and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/repair-contact-schema.yml
          git add apps/api/prisma/schema.prisma apps/api/prisma/migrations/20260901190000_contact_ownership_lifecycle/migration.sql
          git commit -m "schema(contact): add authoritative ownership lifecycle"
          git push
