name: Deploy JEST API

on:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read
  id-token: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/api
  AWS_REGION: ap-south-1

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter api exec prisma generate

      - name: Lint
        run: pnpm turbo run lint --filter=api

      - name: Test
        run: pnpm turbo run test --filter=api

      - name: Tenancy AST Security Analysis
        run: pnpm --filter api exec ts-node ../../scripts/analyze-tenant-security.ts

      - name: Dependency Security Audit
        run: pnpm audit --audit-level=high

      - name: Build API
        run: pnpm turbo run build --filter=api

  deploy:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the project directory
            cd ~/JEST-TECH- || cd ~/jest-policy-crm
            
            # Reset to ensure clean state and pull matching branch
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            
            # Install dependencies and build
            pnpm install --frozen-lockfile
            pnpm --filter api exec prisma generate
            pnpm --filter api exec prisma migrate deploy
            pnpm run build
            
            # Restart the application using PM2
            pm2 restart all || pm2 start pnpm --name "jest-app" -- run start
