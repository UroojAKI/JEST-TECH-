name: Temporary Dependency Lockfile Remediation

on:
  push:
    branches:
      - feature/health-insurance-crm
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/regenerate-lockfile.yml'

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/health-insurance-crm
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile using patched dependency overrides
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Require high-severity audit to pass
        run: pnpm audit --audit-level=high
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: patch vulnerable transitive dependencies"
            git push origin HEAD:feature/health-insurance-crm
          fi
