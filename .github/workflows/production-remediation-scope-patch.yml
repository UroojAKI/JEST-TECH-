name: Production remediation scope patch

on:
  push:
    branches: [production-rebuild-2026]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(finance): enforce commission organizational scope'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production-rebuild-2026
          fetch-depth: 0

      - name: Patch commission scope
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('apps/api/src/modules/finance/controllers/finance.controller.ts')
          text = path.read_text()

          text = text.replace(
              '  BadRequestException,\n',
              '  BadRequestException,\n  ForbiddenException,\n',
              1,
          )

          old = '''  async getCommissions() {\n    try {\n      return await this.prisma.commission.findMany({\n        orderBy: { createdAt: 'desc' },\n        take: 50,\n      });\n    } catch {\n      throw new InternalServerErrorException('Unable to load commission register');\n    }\n  }'''

          new = '''  async getCommissions(@CurrentUser() user: RequestUser) {\n    try {\n      const where =\n        user.role === RoleType.SALES_AGENT\n          ? { userId: user.id }\n          : user.role === RoleType.BRANCH_MANAGER\n            ? { user: { branchId: user.branchId ?? '__NO_BRANCH_SCOPE__' } }\n            : {};\n\n      return await this.prisma.commission.findMany({\n        where,\n        orderBy: { createdAt: 'desc' },\n        take: 50,\n      });\n    } catch {\n      throw new InternalServerErrorException('Unable to load commission register');\n    }\n  }'''

          if old not in text:
              raise SystemExit('getCommissions target not found')
          text = text.replace(old, new, 1)

          old = '''    const commission = await this.prisma.commission.findUnique({\n      where: { id },\n    });'''
          new = '''    const commission = await this.prisma.commission.findUnique({\n      where: { id },\n      include: {\n        user: {\n          select: { branchId: true },\n        },\n      },\n    });'''
          if old not in text:
              raise SystemExit('commission lookup target not found')
          text = text.replace(old, new, 1)

          old = '''    if (!commission) {\n      throw new NotFoundException(`Commission ${id} not found`);\n    }\n\n    if (commission.status !== 'ACCRUED') {'''
          new = '''    if (!commission) {\n      throw new NotFoundException(`Commission ${id} not found`);\n    }\n\n    if (user.role === RoleType.BRANCH_MANAGER) {\n      if (!user.branchId || commission.user.branchId !== user.branchId) {\n        throw new ForbiddenException('Commission is outside the actor branch scope');\n      }\n    }\n\n    if (commission.status !== 'ACCRUED') {'''
          if old not in text:
              raise SystemExit('commission authorization target not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Verify targeted source invariants
        run: |
          grep -q "user.role === RoleType.SALES_AGENT" apps/api/src/modules/finance/controllers/finance.controller.ts
          grep -q "Commission is outside the actor branch scope" apps/api/src/modules/finance/controllers/finance.controller.ts
          grep -q "ForbiddenException" apps/api/src/modules/finance/controllers/finance.controller.ts

      - name: Commit remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/modules/finance/controllers/finance.controller.ts .github/workflows/production-remediation-scope-patch.yml
          git rm --cached .github/workflows/production-remediation-scope-patch.yml
          git commit -m "fix(finance): enforce commission organizational scope"
          git push origin production-rebuild-2026
