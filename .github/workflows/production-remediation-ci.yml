name: Production Remediation CI

on:
  push:
    branches: [production-rebuild-2026]
  pull_request:
    branches: [main, production-rebuild-2026]

permissions:
  contents: read

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm exec prisma generate

      - name: Validate Prisma schema
        working-directory: apps/api
        run: pnpm exec prisma validate

      - name: API typecheck
        working-directory: apps/api
        run: pnpm exec tsc --noEmit

      - name: Web typecheck
        working-directory: apps/web
        run: pnpm exec tsc --noEmit

      - name: API unit tests
        working-directory: apps/api
        run: pnpm test -- --runInBand

      - name: Web tests
        working-directory: apps/web
        run: pnpm test -- --runInBand

      - name: API build
        working-directory: apps/api
        run: pnpm build

      - name: Web build
        working-directory: apps/web
        run: pnpm build

      - name: Dependency security audit
        run: pnpm audit --audit-level moderate

      - name: Production source safety scan
        shell: bash
        run: |
          set -euo pipefail
          patterns=(
            'generatePdfStub'
            'jest_access_token'
            'jest_refresh_token'
            'localStorage\\.(setItem|getItem|removeItem).*?(quotation|policy|lead|branch|financial|workflow|payment|claim)'
          )
          for pattern in "${patterns[@]}"; do
            if grep -RIn --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist --exclude-dir=coverage -E "$pattern" apps/web apps/api; then
              echo "Production safety scan found prohibited pattern: $pattern"
              exit 1
            fi
          done
