# WARNING: Do not commit actual secrets to source control.
# In production, use Sealed Secrets, External Secrets, or HashiCorp Vault.
apiVersion: v1
kind: Secret
metadata:
  name: jest-api-secrets
  namespace: jest-policy
type: Opaque
stringData:
  DATABASE_URL: "CHANGE_ME_DATABASE_URL"
  JWT_SECRET: "CHANGE_ME_JWT_SECRET"
  JWT_REFRESH_SECRET: "CHANGE_ME_JWT_REFRESH_SECRET"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"

