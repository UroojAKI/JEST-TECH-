# WARNING: Do not commit actual secrets to source control.
# In production, use Sealed Secrets, External Secrets, or HashiCorp Vault.
apiVersion: v1
kind: Secret
metadata:
  name: jest-api-secrets
  namespace: jest-policy
type: Opaque
stringData:
  DATABASE_URL: "CHANGE_ME_DATABASE_URL"
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_MIN_32_CHARS"
  JWT_REFRESH_SECRET: "CHANGE_ME_JWT_REFRESH_SECRET_MIN_32_CHARS"
  PII_ENCRYPTION_KEY: "CHANGE_ME_PII_ENCRYPTION_KEY_MIN_32_CHARS"
  COOKIE_SECRET: "CHANGE_ME_COOKIE_SECRET_MIN_32_CHARS"
  CSRF_SECRET: "CHANGE_ME_CSRF_SECRET_MIN_32_CHARS"
  METRICS_SCRAPE_TOKEN: "CHANGE_ME_METRICS_SCRAPE_TOKEN_MIN_32_CHARS"
  REDIS_PASSWORD: "CHANGE_ME_REDIS_PASSWORD"

